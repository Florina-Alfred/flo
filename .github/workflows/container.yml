name: Container

# Builds, pushes, and signs container images for flo-server and flo-client
# (both default and media feature variants). Runs on every PR (build only,
# no push), on main pushes (latest + sha tags), and on v* tags (semver tags).
#
# Signing: keyless Cosign via Sigstore (Fulcio + Rekor) using GitHub OIDC.
# SBOM: Syft SPDX, attested with Cosign.
# Provenance: SLSA build provenance via actions/attest-build-provenance.

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: ["**"]

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  # Detect whether the change touches the image inputs (Dockerfile, Rust
  # source, Cargo manifest) or is limited to workflow/docs files. Deps-only
  # PRs (e.g. action pin bumps) do NOT need 4x1h cross-arch builds; on `push`
  # (main / tags) the build always runs so images are produced.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --depth=1
          BASE="origin/${{ github.base_ref }}"
          FILES=$(git diff --name-only "$BASE"..HEAD)
          echo "Changed files:"
          echo "$FILES"
          if echo "$FILES" | grep -Eq '^(Dockerfile|Cargo\.toml|Cargo\.lock)$|^src/'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  images:
    name: ${{ matrix.binary }}-${{ matrix.variant }}
    needs: [changes]
    # Skip image builds for PRs that do not change image content (e.g.
    # workflow-action pin bumps), avoiding 4x1h cold QEMU cross-builds.
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        binary: [server, client]
        variant: [default, media]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lowercase registry owner
        id: owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Derive image name
        id: image
        run: |
          SUFFIX="${{ matrix.variant == 'media' && '-media' || '' }}"
          echo "name=flo-${{ matrix.binary }}${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "target=${{ matrix.binary }}${SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          target: ${{ steps.image.outputs.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=container-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.variant }}

      # --- Signing & attestation (only on main / tags) ---

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign \
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}

      - name: Generate SPDX SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Attest SBOM with Cosign
        if: github.event_name != 'pull_request'
        run: |
          syft \
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }} \
            --platform linux/amd64 \
            -o spdx-json=sbom.spdx.json
          cosign attest \
            --predicate sbom.spdx.json \
            --type spdxjson \
            --yes \
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}

      - name: Attach SLSA build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
