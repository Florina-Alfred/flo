name: Container

# Builds, pushes, and signs container images for flo-server and flo-client
# (both default and media feature variants). Runs on every PR (build only,
# no push), on main pushes (latest + sha tags), and on v* tags (semver tags).
#
# Signing: keyless Cosign via Sigstore (Fulcio + Rekor) using GitHub OIDC.
# SBOM: Syft SPDX, attested with Cosign.
# Provenance: SLSA build provenance via actions/attest-build-provenance.

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: ["**"]

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  # Detect whether the change touches the image inputs (Dockerfile, Rust
  # source, Cargo manifest) or is limited to workflow/docs files. Deps-only
  # PRs (e.g. action pin bumps) do NOT need 4x1h cross-arch builds; on `push`
  # (main / tags) the build always runs so images are produced.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --depth=1
          BASE="origin/${{ github.base_ref }}"
          FILES=$(git diff --name-only "$BASE"..HEAD)
          echo "Changed files:"
          echo "$FILES"
          if echo "$FILES" | grep -Eq '^(Dockerfile|Cargo\.toml|Cargo\.lock)$|^src/'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  # Build one image per (binary, variant, platform). Each platform is built on
  # its native architecture: linux/amd64 on ubuntu-latest and linux/arm64 on the
  # free `ubuntu-24.04-arm` hosted runner. No QEMU emulation, which previously
  # blew past the 60-minute `timeout-minutes` on cold cache (#152) — and, since
  # a timed-out build never exports its GHA cache, that cache could never warm.
  # The multi-arch manifest index for the final tags is assembled by the `merge`
  # job below (only on push events).
  images:
    name: ${{ matrix.binary }}-${{ matrix.variant }}-${{ matrix.platform }}
    needs: [changes]
    # Skip image builds for PRs that do not change image content (e.g.
    # workflow-action pin bumps), avoiding unnecessary full builds.
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        binary: [server, client]
        variant: [default, media]
        platform: [amd64, arm64]
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # Native builds removed the QEMU-emulation cost (#152), but a cold-cache
    # `media` arm64 build can still run long. 90 min of headroom (was 60) keeps
    # a cold build from timing out and protects the cache-exports guarantee in
    # the block comment above. Residual cold-cache risk is documented in
    # AGENTS.md.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Lowercase registry owner
        id: owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Derive image name
        id: image
        run: |
          SUFFIX="${{ matrix.variant == 'media' && '-media' || '' }}"
          echo "name=flo-${{ matrix.binary }}${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "target=${{ matrix.binary }}${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "platform=linux/${{ matrix.platform }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single-platform image pushed under a platform-specific tag. The final
      # multi-arch tags (latest / sha-* / v*) are created by the `merge` job.
      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          target: ${{ steps.image.outputs.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ steps.image.outputs.name }}:${{ github.sha }}-${{ matrix.platform }}
          platforms: ${{ steps.image.outputs.platform }}
          cache-from: type=gha,scope=container-${{ matrix.variant }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.variant }}-${{ matrix.platform }}

  # Assemble the multi-arch manifest index for the final tags (latest / sha-* /
  # semver), then attach signing, SBOM, and SLSA provenance. Only on main pushes
  # and v* tags — PRs only build (done in `images`), they never push.
  merge:
    name: merge-${{ matrix.binary }}-${{ matrix.variant }}
    needs: [changes, images]
    # Skip on deps-only PRs (nothing was built) and on PR events entirely —
    # images are never pushed for PRs, so there is nothing to merge/sign.
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        binary: [server, client]
        variant: [default, media]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Lowercase registry owner
        id: owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Derive image name
        id: image
        run: |
          SUFFIX="${{ matrix.variant == 'media' && '-media' || '' }}"
          echo "name=flo-${{ matrix.binary }}${SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create and push multi-arch manifest index
        id: build
        run: |
          set -euo pipefail
          REPO="${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ steps.image.outputs.name }}"
          AMD="$REPO:${{ github.sha }}-amd64"
          ARM="$REPO:${{ github.sha }}-arm64"
          digest=""
          # Point every final tag (latest / sha-* / v*) at a multi-arch index
          # assembled from the two single-platform images. The metadata-action
          # emits full refs (ghcr.io/.../name:tag), one per line, so absorb them
          # into an array first (a bare `for tag in $OUTPUT` would mis-parse the
          # embedded newlines), and use each ref as-is.
          mapfile -t tags_to_push < <(printf '%s\n' '${{ steps.meta.outputs.tags }}')
          for tag in "${tags_to_push[@]}"; do
            [[ -n "$tag" ]] || continue
            echo "Tagging $tag (amd64 + arm64)"
            docker buildx imagetools create \
              --tag "$tag" \
              "$AMD" "$ARM"
            digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$tag")"
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
          # Rekor (rekor.sigstore.dev) intermittently times out or returns 409 on
          # retries when an equivalent entry already exists in the transparency
          # log. Retry with backoff; treat 409 as success (entry already recorded).
          for attempt in 1 2 3 4 5; do
            if out="$(cosign sign "$IMG" 2>&1)"; then
              echo "sign OK"
              exit 0
            fi
            if echo "$out" | grep -q "equivalent entry already exists"; then
              echo "sign already recorded in Rekor; treating as success"
              exit 0
            fi
            echo "sign attempt $attempt/5 failed; retrying in $((attempt * 10))s"
            echo "$out"
            sleep "$((attempt * 10))"
          done
          echo "cosign sign failed after 5 attempts"
          exit 1

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Attest SBOM with Cosign
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
          syft \
            "$IMG" \
            --platform linux/amd64 \
            -o spdx-json=sbom.spdx.json
          # Same Rekor resilience as `sign` above: the SBOM for a given image is
          # deterministic, so re-running an already-attested image yields a 409
          # conflict — which is fine, the attestation is already in the log.
          for attempt in 1 2 3 4 5; do
            if out="$(cosign attest \
              --predicate sbom.spdx.json \
              --type spdxjson \
              --yes \
              "$IMG" 2>&1)"; then
              echo "attestation OK"
              exit 0
            fi
            if echo "$out" | grep -q "equivalent entry already exists"; then
              echo "attestation already recorded in Rekor; treating as success"
              exit 0
            fi
            echo "attest attempt $attempt/5 failed; retrying in $((attempt * 10))s"
            echo "$out"
            sleep "$((attempt * 10))"
          done
          echo "cosign attest failed after 5 attempts"
          exit 1

      - name: Attach SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
