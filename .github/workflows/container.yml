name: Container

# Builds, pushes, and signs container images for flo-server and flo-client
# (both default and media feature variants). Runs on every PR (build only,
# no push), on main pushes (latest + sha tags), and on v* tags (semver tags).
#
# Signing: keyless Cosign via Sigstore (Fulcio + Rekor) using GitHub OIDC.
# SBOM: Syft SPDX, attested with Cosign.
# Provenance: SLSA build provenance via actions/attest-build-provenance.

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: ["**"]

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  images:
    name: ${{ matrix.binary }}-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        binary: [server, client]
        variant: [default, media]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lowercase registry owner
        id: owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Derive image name
        id: image
        run: |
          SUFFIX="${{ matrix.variant == 'media' && '-media' || '' }}"
          echo "name=flo-${{ matrix.binary }}${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "target=${{ matrix.binary }}${SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          target: ${{ steps.image.outputs.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=container-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.variant }}

      # --- Signing & attestation (only on main / tags) ---

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign \
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}

      - name: Generate SPDX SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Attest SBOM with Cosign
        if: github.event_name != 'pull_request'
        run: |
          syft \
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }} \
            --platform linux/amd64 \
            -o spdx-json=sbom.spdx.json
          cosign attest \
            --predicate sbom.spdx.json \
            --type spdxjson \
            --yes \
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}

      - name: Attach SLSA build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
