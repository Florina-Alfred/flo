name: Publish to crates.io

# Publishes `flo-rs` to crates.io when a version tag (v*) is pushed.
# The token is provided by the CARGO_REGISTRY_TOKEN encrypted secret
# (repo Settings -> Secrets and variables -> Actions). It is NEVER committed
# to the repo and GitHub masks it in logs.
#
# Best-practice notes:
# - Fires ONLY on a `v*` tag push, so it cannot fire on a branch push or PR.
# - A `v*` tag can only reach main via a merged PR, which branch protection
#   already requires to pass the CI gate (ci.yml) + independent review first.
# - A guard step aborts if the tagged commit is not on the main lineage, so a
#   tag pushed on a feature branch will not publish an unintended version.
# - `cargo publish` is idempotent: if the version already exists it errors.
# - Bump `version` in Cargo.toml, merge to main, then tag: `git tag vX.Y.Z &&
#   git push origin vX.Y.Z`.

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Guard — publish only from the main lineage
        # `push: tags` fires on a v* tag pushed to ANY branch. Abort if the
        # tagged commit is not reachable from main, so releases only happen
        # from commits that went through a reviewed PR.
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" "origin/main"; then
            echo "Tag commit is not on the main lineage; aborting publish."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Verify package
        run: cargo publish --dry-run
      - name: Validate README
        run: |
          test -s README.md || { echo "::error::README.md is missing or empty"; exit 1; }
          grep -q -E '^# flo' README.md || { echo "::error::README.md missing expected heading"; exit 1; }
          grep -q -i 'license' README.md || { echo "::error::README.md missing license section"; exit 1; }
          echo "README.md content validation passed"
      - name: Check README diff vs crates.io
        run: |
          VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')
          echo "Package version: ${VERSION}"

          API_JSON=$(curl -sL "https://crates.io/api/v1/crates/flo-rs")
          LATEST_PUBLISHED=$(echo "$API_JSON" | jq -r '.crate.max_stable_version // .crate.max_version // empty')

          if [ -z "$LATEST_PUBLISHED" ]; then
            echo "No published version found — first publish. Skipping diff."
            exit 0
          fi

          echo "Latest published: ${LATEST_PUBLISHED}"

          TMPDIR=$(mktemp -d)
          # Redirect follows to the CDN tarball
          curl -sL "https://crates.io/api/v1/crates/flo-rs/${LATEST_PUBLISHED}/download" -o "${TMPDIR}/crate.tar.gz"
          tar -xzf "${TMPDIR}/crate.tar.gz" -C "${TMPDIR}"
          PUBLISHED_README="${TMPDIR}/flo-rs-${LATEST_PUBLISHED}/README.md"

          if [ ! -f "$PUBLISHED_README" ]; then
            echo "Could not extract README from published crate; skipping diff."
            rm -rf "$TMPDIR"
            exit 0
          fi

          if diff -q README.md "$PUBLISHED_README" >/dev/null 2>&1; then
            echo "::warning title=README unchanged::README.md is identical to the last published version (${LATEST_PUBLISHED}). Consider updating it before publishing."
          else
            echo "README.md differs from last published version:"
            diff README.md "$PUBLISHED_README" || true
          fi

          rm -rf "$TMPDIR"
      - name: Publish to crates.io
        run: cargo publish --token "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
