name: Publish to crates.io

# Publishes `flo-rs` to crates.io and creates a GitHub Release when a version
# tag (v*) is pushed. Can also be run manually (workflow_dispatch) to create a
# GitHub Release for an existing tag without touching crates.io again.
#
# The crates.io token is provided by the CARGO_REGISTRY_TOKEN encrypted secret
# (repo Settings -> Secrets and variables -> Actions). It is NEVER committed
# to the repo and GitHub masks it in logs.
#
# Best-practice notes:
# - Fires on a `v*` tag push AND on manual workflow_dispatch.
# - A `v*` tag can only reach main via a successful PR, which branch protection
#   already requires to pass the CI gate (ci.yml) + independent review first.
# - A guard step aborts if the tagged commit is not on the main lineage, so a
#   tag pushed on a feature branch will not publish an unintended version.
# - `cargo publish` is idempotent: if the version already exists it errors.
# - The GitHub Release is created ONLY after `cargo publish` succeeds (so the
#   release never exists without the crate version being live), except on
#   manual dispatch where no publish happens.
# - Bump `version` in Cargo.toml, merge to main, then tag: `git tag vX.Y.Z &&
#   git push origin vX.Y.Z`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to create a GitHub Release for (e.g. v0.1.3). No crates.io publish is performed."
        required: false

concurrency:
  # On tag pushes the ref is the tag itself. On manual dispatch multiple tags
  # would share refs/heads/main, so key on the target tag to avoid cancelling
  # concurrent backfilled releases.
  group: publish-${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tag || 'manual') || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: cargo publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Guard — publish only from the main lineage
        # `push: tags` fires on a v* tag pushed to ANY branch. Abort if the
        # tagged commit is not reachable from main, so releases only happen
        # from commits that went through a reviewed PR.
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" "origin/main"; then
            echo "Tag commit is not on the main lineage; aborting publish."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned action commit
        with:
          # Pinned to the MSRV (1.97.1, same as ci.yml) so the 'Refresh
          # lockfile' step below reproduces the committed Cargo.lock exactly.
          # A rolling `stable` here would generate a differently-ordered lock
          # and trip cargo's built-in dirty-tree check (the `cargo publish
          # --dry-run` verify step) on every release.
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Refresh lockfile
        # cargo publish --dry-run downloads the latest index, which can update
        # Cargo.lock during dependency resolution, causing a dirty-tree error.
        # Pre-refresh to keep the tree clean.
        run: cargo generate-lockfile
      - name: Verify package
        run: cargo publish --dry-run
      - name: Validate README
        run: |
          test -s README.md || { echo "::error::README.md is missing or empty"; exit 1; }
          grep -q -E '^# flo' README.md || { echo "::error::README.md missing expected heading"; exit 1; }
          grep -q -i 'license' README.md || { echo "::error::README.md missing license section"; exit 1; }
          echo "README.md content validation passed"
      - name: Check README diff vs last tag
        run: |
          git fetch --tags origin
          # Get the previous version tag (second-newest, excluding this one)
          PREV_TAG=$(git tag -l 'v*' --sort=-version:refname | tail -n +2 | head -1)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous version tag found — first publish. Skipping diff."
            exit 0
          fi

          echo "Previous tag: ${PREV_TAG}"

          if git diff --quiet "${PREV_TAG}"..HEAD -- README.md; then
            echo "::error::README.md has not changed since ${PREV_TAG}. Update README.md before publishing a new version."
            exit 1
          else
            echo "README.md has changed since ${PREV_TAG}:"
            git diff "${PREV_TAG}"..HEAD -- README.md || true
          fi
      - name: Publish to crates.io
        run: cargo publish --token "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: GitHub Release
    # On a tag push, only after crates.io publish succeeded. On manual
    # dispatch, always (no crates.io publish is performed).
    needs: publish
    if: always() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # full history + tags so release notes can diff tags
          ref: ${{ env.RELEASE_TAG }}
      - name: Guard — release tag exists
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::No tag provided. Run manually with the tag input, or push a v* tag."
            exit 1
          fi
          case "${RELEASE_TAG}" in
            v*) : ;;
            *) echo "::error::'${RELEASE_TAG}' is not a version tag (expected vX.Y.Z)."; exit 1 ;;
          esac
          git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null || {
            echo "::error::Tag ${RELEASE_TAG} does not exist."
            exit 1
          }
          echo "Releasing ${RELEASE_TAG}"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned action commit
        with:
          # Pinned to the MSRV (1.97.1, same as the publish job / ci.yml) for a
          # deterministic release binary and lockfile — a rolling `stable` would
          # make rebuilds non-reproducible.
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release binary
        run: cargo build --release --bin flo
      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx@0.5.9 --locked
          cargo cyclonedx -f json --override-filename sbom.cdx
      - name: Generate release notes
        # Older tags may predate scripts/release-notes.sh; pull it from main
        # so backfilled releases still get structured notes.
        run: |
          if [ ! -f scripts/release-notes.sh ]; then
            echo "scripts/release-notes.sh missing from this tag; fetching from main."
            git fetch origin main
            git show origin/main:scripts/release-notes.sh > scripts/release-notes.sh
            [ -s scripts/release-notes.sh ] || { echo "::error::Could not fetch release-notes.sh"; exit 1; }
          fi
          bash scripts/release-notes.sh "${RELEASE_TAG}" > release-notes.md
      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            --title "flo-rs ${RELEASE_TAG}" \
            --notes-file release-notes.md \
            target/release/flo \
            sbom.cdx.json
          echo "Created GitHub Release ${RELEASE_TAG}"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Stage release assets for signing
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ steps.release.outputs.created }}" = "true" ]; then
            echo "subject=target/release/flo" >> "$GITHUB_OUTPUT"
            echo "sbom=sbom.cdx.json" >> "$GITHUB_OUTPUT"
          else
            # Release already exists (e.g. a workflow_dispatch backfill or a
            # re-run): sign the *published* assets rather than a fresh local
            # build, which may not be byte-identical, so the signature always
            # matches what users download.
            rm -rf .release-asset
            gh release download "${RELEASE_TAG}" -p flo -D .release-asset
            gh release download "${RELEASE_TAG}" -p sbom.cdx.json -D .release-asset
            echo "subject=.release-asset/flo" >> "$GITHUB_OUTPUT"
            echo "sbom=.release-asset/sbom.cdx.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release assets (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          SUBJECT="${{ steps.stage.outputs.subject }}"
          # Keyless Cosign on the raw binary, mirroring the container pattern.
          # Each sign-blob uses a fresh ephemeral key + certificate, so (unlike
          # image re-signing) the entries always differ and Rekor's 409 conflict
          # does not apply here — only intermittent timeouts do.
          for attempt in 1 2 3 4 5; do
            if cosign sign-blob --bundle flo.bundle "$SUBJECT"; then
              echo "sign OK"
              exit 0
            fi
            echo "sign attempt $attempt/5 failed; retrying in $((attempt * 10))s"
            sleep "$((attempt * 10))"
          done
          echo "::error::cosign sign-blob failed after 5 attempts"
          exit 1
      - name: Upload signature to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --clobber "${RELEASE_TAG}" flo.bundle
      - name: Attach SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # subject-path is a newline- or comma-delimited list — a
          # space-joined single string is treated as one glob and fails.
          subject-path: |
            ${{ steps.stage.outputs.subject }}
            ${{ steps.stage.outputs.sbom }}
