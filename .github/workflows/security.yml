name: Security & Release

# Full security pipeline + release artifact.
# Runs ONLY on main (push) and on version tags.
# Branch/PR validation is handled by .github/workflows/ci.yml (the required
# status-check gate). Keeping the security scan on main limits the blast
# radius of any third-party action and conserves free-tier minutes.

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  # Releases must never be cancelled (INFRA-10) — tag pushes are releases
  group: security-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned action commit
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Caches ~/.cargo (incl. installed binaries) so the repeated
        # `cargo install` of the security tooling is a no-op on cache hit
        # instead of rebuilding the same crate graph every run.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        # Hard gate: fails on any RUSTSEC advisory not explicitly allowlisted.
        # Allowlisted IDs live in audit.toml ([advisories].ignore) and
        # .cargo/audit.toml (native cargo-audit config, INFRA-10). We let
        # cargo-audit read .cargo/audit.toml directly — no grep scraping of
        # audit.toml comments (which previously suppressed IDs mentioned in
        # comments). New/unlisted advisories still fail.
        run: |
          mkdir -p .cargo
          if [ -f audit.toml ]; then cp audit.toml .cargo/audit.toml; fi
          cargo audit --json > audit.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-audit
          path: audit.json
          retention-days: 30

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned action commit
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run deny
        # INFRA-10: also check advisories via deny.toml (single source of truth
        # alongside audit.toml); bans+licenses were previously the only checks.
        run: cargo deny check advisories licenses bans sources

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned action commit
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx@0.5.9 --locked
      - name: Generate SBOM
        run: cargo cyclonedx -f json --override-filename sbom.cdx
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flo-sbom
          path: sbom.cdx.json
          retention-days: 30

  trivy:
    name: trivy fs scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Trivy filesystem scan
        # v0.36.0 — known-good release after the 2026-03 supply-chain
        # compromise. SHA verified against the signed GitHub release.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,config
          format: sarif
          output: trivy.sarif
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Speeds up CodeQL autobuild by reusing cached cargo registry/target.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql

  build:
    # Build the release binaries once and publish them as artifacts so the
    # `release` job (and downstream publish workflow) can consume them without
    # recompiling. Runs in parallel with the audit/deny/sbom/trivy/codeql scans
    # instead of being serialized behind them. Only built on tags, where a consumer exists.
    # Produces both `flo` and `flo-server` (Cargo.toml defines two [[bin]] targets).
    name: build release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned action commit
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release binaries
        run: cargo build --release --bin flo --bin flo-server
      - name: Upload binary artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: |
            target/release/flo
            target/release/flo-server
          retention-days: 30

  release:
    name: release artifact
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download prebuilt binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: dist
      - name: Ensure binaries are executable
        run: chmod +x dist/flo dist/flo-server
      - name: Publish versioned binary artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flo-${{ github.ref_name }}-linux-x86_64
          path: |
            dist/flo
            dist/flo-server
          retention-days: 30
