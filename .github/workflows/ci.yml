name: CI

# Minimal pipeline: runs on pushes to `main` and on every pull request.
# Feature branches run CI once via the PR event (scoping `push` to `main`
# only avoids duplicate runs when a branch is both pushed and PR'd).
# This is the required status-check gate for merging into main.
# The heavy security scanning (audit/deny/trivy/codeql/release) lives in
# .github/workflows/security.yml and runs ONLY on main (push + tags).

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Detect whether the change affects Rust (code/Cargo.toml/workflows) or is
  # docs-only. Implemented with plain git diff (no third-party action) so the
  # supply-chain surface stays minimal.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "docs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Compare the PR head against the base branch.
          git fetch origin "${{ github.base_ref }}" --depth=1
          BASE="origin/${{ github.base_ref }}"
          FILES=$(git diff --name-only "$BASE"..HEAD)
          echo "Changed files:"
          echo "$FILES"
          if echo "$FILES" | grep -Eq '\.(rs)$|^(Cargo\.toml|Cargo\.lock)$|\.github/workflows/'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$FILES" | grep -Eq '\.md$|^docs/'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash


  fmt:
    name: fmt
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned action commit
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - if: needs.changes.outputs.rust == 'true'
        name: Check formatting
        run: cargo fmt --all -- --check

  package:
    name: package
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned action commit
        with:
          toolchain: "1.97.1"
      - name: Check crate package contents
        run: |
          set -euo pipefail
          echo "Checking cargo package --list for leaked internals..."
          cargo package --list > /tmp/package.list
          cat /tmp/package.list
          if grep -Eq "^\.agents/|manual_test\.log|skills-lock\.json|^\.actrc|docs/superpowers|deploy/" /tmp/package.list; then
            echo "::error::cargo package --list leaks internal files (.agents/, docs/superpowers/, manual_test.log, skills-lock.json, .actrc, deploy/)"
            exit 1
          fi
          echo "Package contents OK — no internals leaked."

  clippy:
    name: clippy
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned action commit
        with:
          toolchain: "1.97.1"
          components: clippy
      - if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: needs.changes.outputs.rust == 'true'
        name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.rust }})
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, "1.97.1"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned action commit
        with:
          toolchain: ${{ matrix.rust }}
      - if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: needs.changes.outputs.rust == 'true'
        name: Cargo check
        run: cargo check --all-targets
      - if: needs.changes.outputs.rust == 'true'
        name: Cargo test
        # --lib --tests runs the real unit + integration suite. The previous
        # `cargo test --bin flo` only executed src/bin/flo-client.rs (0 tests)
        # so deleting every test kept the gate green (INFRA-01).
        run: cargo test --lib --tests
      - if: needs.changes.outputs.rust == 'true'
        name: Assert tests ran
        run: |
          count=$(cargo test --lib --tests -- --list 2>&1 | grep -c ": test")
          echo "Discovered $count tests (lib+integration)"
          if [ "$count" -eq 0 ]; then
            echo "ERROR: no tests discovered — gate is vacuous (INFRA-01)"
            exit 1
          fi
      - if: needs.changes.outputs.rust == 'true'
        name: Ignored suite compiles (INFRA-09)
        run: cargo test -- --ignored --list

  # The `media` feature needs system GStreamer, so it is excluded from the
  # default (free-tier, no-system-deps) pipeline above. This job installs the
  # GStreamer dev packages and verifies the media build, example, and clippy.
  media:
    name: media
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned action commit
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install GStreamer dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libx264-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly
      - name: Clippy (media, deny warnings)
        run: cargo clippy --features media --all-targets -- -D warnings
      - name: Build (media)
        run: cargo build --features media
      - name: Build example (media)
        run: cargo build --features media --example video_peer
      - name: Test (media)
        # Same INFRA-01 fix: --lib --tests covers #[cfg(feature="media")] tests;
        # --bin flo had 0 tests so the media gate was vacuous.
        run: cargo test --features media --lib --tests
      - name: Assert media tests ran
        run: |
          count=$(cargo test --features media --lib --tests -- --list 2>&1 | grep -c ": test")
          echo "Discovered $count tests (media lib+integration)"
          if [ "$count" -eq 0 ]; then
            echo "ERROR: no media tests discovered — gate is vacuous (INFRA-01)"
            exit 1
          fi

  coverage:
    name: coverage
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned
        with:
          toolchain: "1.97.1"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-llvm-cov@0.6.18
      - name: Collect coverage (lcov)
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info
      - name: Enforce 50% threshold (advisory, non-blocking ratchet)
        continue-on-error: true
        run: cargo llvm-cov report --fail-under-lines 50
      - name: Upload lcov artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov-coverage
          path: lcov.info
          retention-days: 30
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./lcov.info
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
