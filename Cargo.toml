[package]
name = "flo-rs"
version = "0.1.5"
edition = "2024"
rust-version = "1.97.1"
authors = ["Florina-Alfred"]

description = "Zenoh-mesh robot fleet orchestration in safe Rust — declarative hot-reloadable rules, pub/sub registration and liveliness."
license = "Apache-2.0"
repository = "https://github.com/Florina-Alfred/flo"
homepage = "https://github.com/Florina-Alfred/flo"
documentation = "https://github.com/Florina-Alfred/flo#readme"
readme = "README.md"
include = ["src/", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md", "examples/", "benches/"]
keywords = ["robotics", "zenoh", "orchestration", "fleet", "robot"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
axum = "0.8.9"
anyhow = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "signal"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
webrtc = { version = "0.21.0-alpha.1", optional = true }
async-trait = { version = "0.1", optional = true }
rtc = { version = "0.21.0-alpha.1", optional = true }
zenoh = { version = "1.9.0", features = ["unstable"] }

bytes = "1"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }

[dependencies.gstreamer]
version = "0.25"
optional = true

[dependencies.gstreamer-app]
version = "0.25"
optional = true

[features]
default = []
media = [
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:webrtc",
    "dep:async-trait",
    "dep:rtc",
]

# The published crate is `flo-rs`, but the CLI binary users run stays `flo`.
[dev-dependencies]
serde_json = "1.0.150"

[[bin]]
name = "flo"
path = "src/bin/flo-client.rs"

[[bin]]
name = "flo-server"
path = "src/bin/flo-server.rs"
