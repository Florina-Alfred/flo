# cargo-deny configuration for flo
# Denies deps with unlisted licenses; allows permissive + weak-copyleft MPL-2.0.
# Advisories allowlist is synced with audit.toml (INFRA-10): single source of
# truth for reviewed exceptions; cargo deny check advisories enforces it.

[advisories]
version = 2
yanked = "warn"
unmaintained = "none"
# Keep in sync with audit.toml [advisories].ignore — reviewed exceptions:
# - RUSTSEC-2023-0071 (rsa): no fixed upgrade, transitive via zenoh
# - RUSTSEC-2026-0041 (lz4_flex): fix exists but zenoh 1.9.0 pins 0.10
# - RUSTSEC-2024-0436 (paste 1.0.15, unmaintained): transitive via zenoh 1.10.0
# - RUSTSEC-2025-0134 (rustls-pemfile 2.2.0, unmaintained): transitive via zenoh 1.10.0
# yanked = "warn" (was "deny") — chacha20 0.10.1 is yanked but still pulled via rand 0.10.2 → quinn-proto → zenoh 1.10.0; no direct use, accepted as warning until Zenoh updates rand.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0041", "RUSTSEC-2024-0436", "RUSTSEC-2025-0134"]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-1-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow = []
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
